# K-N (kaon-nucleon, exotic S=+1) S-matrix / phase-shift waves.
# Partial-wave analysis of Gibbs, Arceo, Phys. Rev. C75 (2007) 054005
# [nucl-th/0611095]: delta = atan[a q^(2l+1) / (1 + sum_i b_i q^(2i))],
# q = CM momentum [GeV/c].
# One line per partial wave:  <channel>:<wave>   <listFile>   <decayFile>   <model>
#   (same format as the other .conf files; paths relative to this file)
#
# All synthetic clusters (no S=+1 resonances): the "-" columns create them via the
# catalog. Wave key = numeric 2J+1 (S/P1/2 -> 2, P3/2 -> 4); the orbital l is
# carried in the synthetic-id excitation slot so S/P1/2 (both 2J+1=2) stay distinct.
# B=+1, S=+1, fermionic clusters; elastic below the K-pi-N threshold ~1.57 GeV.
# Naming L_{2I,2J}: S01/P01/P03 are I=0, S11/P11/P13 are I=1.

# I=1 (S-wave strongly repulsive):
KN_S11:2   -   -   GibbsArceo2007_S11   # I=1 S-wave (repulsive)
KN_P11:2   -   -   GibbsArceo2007_P11   # I=1 P-wave (J=1/2)
KN_P13:4   -   -   GibbsArceo2007_P13   # I=1 P-wave (J=3/2)
# I=0 (weakly repulsive S-wave; P-waves show a spin-orbit splitting):
KN_S01:2   -   -   GibbsArceo2007_S01   # I=0 S-wave
KN_P01:2   -   -   GibbsArceo2007_P01   # I=0 P-wave (J=1/2)
KN_P03:4   -   -   GibbsArceo2007_P03   # I=0 P-wave (J=3/2)

# The small K-N D/F waves are omitted. See KN_GibbsArceo_reference.md for the full
# coefficient tables and a numerical validation.
