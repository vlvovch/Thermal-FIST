# Pi-N S-matrix / phase-shift waves.
# Conformal Roy-Steiner parametrization of Hoferichter, Ruiz de Elvira, Kubis,
# Meissner, Phys. Rept. 625 (2016) 1 [1510.06039], Appendix D.
# One line per partial wave:  <channel>:<wave>   <listFile>   <decayFile>   <model>
#   (same format as pipi.conf / piK.conf; paths relative to this file's directory)

# pi-N I=3/2 P-wave = the Delta(1232) (P33): resonant (branch-tracked through
# 90 deg at the Delta), elastic across the resonance up to the matching point
# ~1.38 GeV. REUSES the real Delta PDG codes (2224, 2214, 2114, 1114), overriding
# their thermal contribution while they stay in the list as decay products.
# The wave key is the numeric 2J+1 = 4 (J=3/2): the S/P/D letters encode the meson
# relation 2J+1 = 2l+1, which does not apply to baryon waves (here J = l + 1/2).
piN_Delta:4   -   -   RoySteiner2016_P33   # Delta(1232), reuses 2224/2214/2114/1114

# Non-resonant Roy-Steiner background waves (Schenk parametrization, App. D).
# Synthetic clusters created by the catalog (the "-" columns: no list/decay file);
# the wave key is the numeric 2J+1 (S/P J=1/2 -> 2, the P13 J=3/2 -> 4). The
# orbital l is carried in the synthetic-id excitation slot so the same-(I,J) waves
# (S31/P31, S11/P11) get distinct codes.
# Elastic up to the matching point ~1.38 GeV:
piN_S31:2     -   -   RoySteiner2016_S31   # I=3/2 S-wave (repulsive)
piN_P13:4     -   -   RoySteiner2016_P13   # I=1/2 P-wave (J=3/2)
# Elastic only below the pi-pi-N threshold ~1.22 GeV (cut there):
piN_S11:2     -   -   RoySteiner2016_S11   # I=1/2 S-wave (attractive)
piN_P31:2     -   -   RoySteiner2016_P31   # I=3/2 P-wave (J=1/2)
piN_P11:2     -   -   RoySteiner2016_P11   # I=1/2 P-wave (J=1/2, Roper tail)
