# Pi-K S-matrix / phase-shift waves (S-wave only).
# Conformal CFD parametrization of Pelaez, Rodas, PRD93 (2016) 074025 [1602.08404].
# One line per partial wave:  <channel>:<wave>   <listFile>   <decayFile>   <model>
#   (same format as pipi.conf; paths relative to this file's directory)

# repulsive pi-K I=3/2 (non-resonant, elastic up to ~1.74 GeV)
piK_I32:S   list-piK_I32_S.dat   decays-piK_I32_S.dat   PelaezRodas2016_S   # I=3/2 S-wave

# attractive pi-K I=1/2 = kappa/K0*(700), elastic only below the K-eta threshold.
# REUSES the real kappa PDG codes (9000321 K+, 9000311 K0): the "-" columns mean
# no list/decay file. The kappa is usually excluded from the HRG list, so it is
# created here (with isospin-CG decays); if present it is overridden instead.
piK_I12:S   -   -   PelaezRodas2016_S   # kappa/K0*(700), reuses 9000321/9000311

# In the GUI you can load pipi.conf and piK.conf together (multi-select) to get
# pi-pi + pi-K simultaneously.
