# Pi-K S-matrix / phase-shift waves.
# Conformal CFD parametrization of Pelaez, Rodas, PRD93 (2016) 074025 [1602.08404].
# One line per partial wave:  <channel>:<wave>   <listFile>   <decayFile>   <model>
#   (same format as pipi.conf; paths relative to this file's directory)

# repulsive pi-K I=3/2 (non-resonant, elastic up to ~1.74 GeV): S, P, D waves
# (all synthetic clusters; the P and D waves are tiny).
piK_I32:S   list/list-piK_I32_S.dat   decays/decays-piK_I32_S.dat   PelaezRodas2016_S   # I=3/2 S-wave
piK_I32:P   list/list-piK_I32_P.dat   decays/decays-piK_I32_P.dat   PelaezRodas2016_P   # I=3/2 P-wave
piK_I32:D   list/list-piK_I32_D.dat   decays/decays-piK_I32_D.dat   PelaezRodas2016_D   # I=3/2 D-wave

# attractive pi-K I=1/2 = kappa/K0*(700), elastic only below the K-eta threshold.
# REUSES the real kappa PDG codes (9000321 K+, 9000311 K0). The per-resonance
# list/decays files carry its real QN: the kappa is usually EXCLUDED from the HRG
# list, so it is created from the file (with isospin-CG decays); if a list does
# have it, that entry is kept and only its thermal contribution is overridden.
piK_I12:S   list/list-piK_I12_S.dat   decays/decays-piK_I12_S.dat   PelaezRodas2016_S   # kappa/K0*(700), reuses 9000321/9000311

# pi-K I=1/2 P-wave = the K*(892), elastic below K-eta (resonant, branch-tracked).
# REUSES the real K*(892) codes (323, 313) with their real QN from the files,
# overriding their contribution while they stay in the list as decay products
# (created from the file if a list happens to lack them).
piK_K892:P   list/list-piK_K892_P.dat   decays/decays-piK_K892_P.dat   PelaezRodas2016_P   # K*(892), reuses 323/313

# In the GUI you can load pipi.conf and piK.conf together (multi-select) to get
# pi-pi + pi-K simultaneously.
