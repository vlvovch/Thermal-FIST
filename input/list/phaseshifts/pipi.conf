# Pi-pi S-matrix / phase-shift channels.
# One channel per line:  <channel>   <model>
# Load with PhaseShifts::AddPhaseShiftChannelsFromFile(TPS, "<this file>").
#
#   <model> is either an analytic registry name, or
#   "tab:<2J+1>=<file>[,<2J+1>=<file>...]" for a tabulated phase shift.

# repulsive pi-pi I=2 (S- and D-waves), Garcia-Martin et al. PRD83 (2011) 074004
pipi_I2     pipi_I2:GarciaMartin2011

