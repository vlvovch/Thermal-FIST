# Pi-pi S-matrix / phase-shift channels.
# One line per entry:  <channel>   <modelspec>
#   <modelspec> :
#     <param>             analytic, all partial waves of the parametrization
#     <param>:<wave>      analytic, a single wave  (wave = S,P,D,F,G or 2J+1)
#     tab:<wave>:<file>   a tabulated wave (M[GeV] delta[rad] table, cubic-spline;
#                         the table carries no J, so the wave must be given)
#   Lines for the same channel accumulate, so different waves can use different
#   models. Load with PhaseShifts::AddPhaseShiftChannelsFromFile(TPS, "<this file>").

# repulsive pi-pi I=2, Garcia-Martin et al. PRD83 (2011) 074004 (S + D waves)
pipi_I2   GarciaMartin2011

# Per-wave / mixed-model examples (provide your own table):
#   pipi_I2   GarciaMartin2011:S        # S-wave from the analytic parametrization
#   pipi_I2   tab:D:delta_pipi_I2_D.dat # ...and the D-wave from a table

