# Pi-pi S-matrix / phase-shift channels.
# One line per partial wave:  <channel>   <wave>   <model>
#   <wave>  : S, P, D, F, G  (or a numeric 2J+1), or "all" for every wave
#   <model> : an analytic parametrization name, or "tab:<file>" for a tabulated
#             phase shift (M[GeV] delta[rad] table, cubic-spline interpolated)
# Load with PhaseShifts::AddPhaseShiftChannelsFromFile(TPS, "<this file>").

# repulsive pi-pi I=2, Garcia-Martin et al. PRD83 (2011) 074004
pipi_I2   S   GarciaMartin2011
pipi_I2   D   GarciaMartin2011

# Mix models per wave, e.g. a tabulated D-wave (provide your own table):
# pipi_I2   D   tab:delta_pipi_I2_D.dat

# Shorthand: one line, all waves of an analytic model:
#   pipi_I2   GarciaMartin2011

