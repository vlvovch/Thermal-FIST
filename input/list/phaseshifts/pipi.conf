# Pi-pi S-matrix / phase-shift waves.
# One line per partial wave:  <channel>:<wave>   <listFile>   <decayFile>   <model>
#   column 1 (key)    : <channel>:<wave>  (wave = S,P,D,F,G or a numeric 2J+1)
#   column 2 (list)   : per-wave particle table (cluster members across Iz)
#   column 3 (decays) : per-wave decays file (isospin Clebsch-Gordan)
#   column 4 (model)  : delta(M) -
#                         <param>       a wave-specific analytic parametrization
#                                       name (one name per wave, e.g. ..._S, ..._D)
#                         tab:<file>    a tabulated (M[GeV] delta[rad]) table
#   File paths are resolved relative to this config file's directory; the .dat
#   files are the hand-editable source of truth.
#   Load with PhaseShifts::AddPhaseShiftChannelsFromFile(TPS, "<this file>").

# repulsive pi-pi I=2, Garcia-Martin et al. PRD83 (2011) 074004
pipi_I2:S   list-pipi_I2_S.dat   decays-pipi_I2_S.dat   GarciaMartin2011_S   # S-wave (J=0)
pipi_I2:D   list-pipi_I2_D.dat   decays-pipi_I2_D.dat   GarciaMartin2011_D   # D-wave (J=2)
#   -> to swap a single wave for a tabulated phase shift, replace its model, e.g.:
#      pipi_I2:D   list-pipi_I2_D.dat   decays-pipi_I2_D.dat   tab:delta_pipi_I2_D.dat

# attractive pi-pi I=0 = the sigma/f0(500), Garcia-Martin Appendix A (branch-
# tracked through 90 deg). Elastic limit: integrated up to the K-Kbar threshold.
# REUSES the real f0(500) (PDG 9000221): the "-" columns mean no new particle is
# added; the density overrides the sigma's (deg=0) entry, which stays a decay
# product. Subsumption by PDG coincidence.
pipi_I0:S   -   -   GarciaMartin2011_S   # sigma/f0(500), reuses 9000221

# pi-pi I=0 above the K-Kbar threshold = the f0(980). It REUSES the real f0(980)
# (PDG 9010221): the "-" columns mean no new particle is added; the phase-shift
# density overrides the existing f0(980)'s thermal contribution while it
# stays in the list as a decay product. Drop this line to keep the f0(980) plain.
pipi_I0_f0980:S   -   -   GarciaMartin2011_S   # f0(980), reuses 9010221

