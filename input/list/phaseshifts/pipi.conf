# Pi-pi S-matrix / phase-shift channels.
# One line per partial wave:  <channel>   <modelspec>
#   <modelspec> :
#     <param>:<wave>      analytic parametrization, a single wave
#                         (wave = S,P,D,F,G or a numeric 2J+1)
#     <param>             analytic, ALL waves of the parametrization (shorthand)
#     tab:<wave>:<file>   a tabulated wave (M[GeV] delta[rad] table, cubic-spline;
#                         the table carries no J, so the wave must be given)
#   Lines for the same channel accumulate, so each wave can use a different model.
#   Load with PhaseShifts::AddPhaseShiftChannelsFromFile(TPS, "<this file>").

# repulsive pi-pi I=2, Garcia-Martin et al. PRD83 (2011) 074004
pipi_I2   GarciaMartin2011:S        # S-wave (J=0)
pipi_I2   GarciaMartin2011:D        # D-wave (J=2)
#   -> to swap a single wave for a tabulated phase shift, replace its line, e.g.:
#      pipi_I2   tab:D:delta_pipi_I2_D.dat
#   -> shorthand for all waves of one parametrization:  pipi_I2  GarciaMartin2011

# Not yet available (need atan2 branch tracking + sigma/rho subsumption):
#   pipi_I0   (attractive; sigma/f0(500), f0(980))
#   pipi_I1   (rho(770))
